[package]
name = "zalo-gpui"
description = "Native GPUI desktop GUI for the Rust Zalo client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# GPUI (GPU/Wayland) macros may expand unsafe blocks. Protocol, storage, and
# call crates keep `unsafe_code = "forbid"` from the workspace lints.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[features]
default = ["tray-xembed"]
tray-xembed = ["zalo-shell/tray-xembed"]

[lib]
name = "zalo_gpui"
path = "src/lib.rs"

[[bin]]
name = "zalo-gpui"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
zalo-design = { workspace = true }
zalo-client = { workspace = true }
zalo-core = { workspace = true }
zalo-protocol = { workspace = true }
zalo-storage = { workspace = true }
zalo-sync = { workspace = true }
zalo-backup = { workspace = true }
zalo-shell = { path = "../zalo-shell" }
qrcode = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
unicode-segmentation = "1.12"
futures = "0.3"
md-5 = { workspace = true }
zjxl = { workspace = true }
zimage = { workspace = true }
zcall-core = { workspace = true }
zcall-audio = { path = "../zcall-audio" }
zcall-engine = { path = "../zcall-engine" }
zocr = { workspace = true }
openh264 = "0.8"
libc = "0.2"
raw-window-handle = "0.6"
x11rb = { version = "0.13.2", features = ["shape", "randr"] }
reqwest = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
zstd = "0.13"
resvg = "0.45"
base64 = { workspace = true }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "ogg", "vorbis", "isomp4", "pcm", "wav", "adpcm"] }
rusty_mp3 = "1.1"
mp4 = "0.14"
