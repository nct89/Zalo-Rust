# Rust workspace for the native Zalo desktop client for Linux.
#
# Built purely in Rust with GPUI (no Electron, Node.js, or Python runtime).
[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/zalo-gpui"]

[workspace.dependencies]
zalo-core = { path = "crates/zalo-core" }
zalo-protocol = { path = "crates/zalo-protocol" }
zalo-client = { path = "crates/zalo-client" }
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = "0.1"
cipher = "0.4"
hex = "0.4"
md-5 = "0.10"
opus = "0.3"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nct89/Zalo-Rust"
rust-version = "1.85"

# GPUI, taffy, cosmic-text, jxl-oxide and image are unusably slow at
# opt-level 0 (a chat render took ~44 ms, JXL thumbs ~1 s each). Optimise
# third-party crates in dev builds; workspace crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# gpui 0.2.2 → zed-async-tar → xattr 0.2.3 still names libc::ENOATTR, which
# Linux libc dropped. Vendor maps it to ENODATA.
[patch.crates-io]
xattr = { path = "vendor/xattr-0.2.3" }
