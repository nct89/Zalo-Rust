[package]
name = "zalo-shell-win"
description = "Windows system tray, notifications, native file dialogs, single-instance IPC, and startup registry for Zalo-Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "zalo_shell"

[features]
default = []
# Accepted so `zalo-gpui`'s `tray-xembed` feature resolves on Windows. XEmbed is Linux-only.
tray-xembed = []

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
windows-registry = "0.5"
