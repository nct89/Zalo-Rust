[package]
name = "zalo-client"
description = "Headless Rust Zalo client: device identity, QR login, session storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "zalo-login"
path = "src/bin/zalo-login.rs"

[dependencies]
zalo-core.workspace = true
zalo-protocol.workspace = true
anyhow.workspace = true
qrcode.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
aes-gcm = "0.10"
flate2 = "1"
hostname = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
