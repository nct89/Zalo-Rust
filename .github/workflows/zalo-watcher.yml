name: Zalo Upstream Watcher

on:
  schedule:
    # Run daily at 02:00 UTC (09:00 UTC+7).
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_analyze:
        description: "Force download, analyze, and open/update PR even if version matches protocol.json"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-and-pr:
    name: Detect, Unpack & Open Upstream PR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install 7z for installer extraction
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full

      - name: Probe official Zalo Windows/macOS feeds & analyze new release
        id: probe
        run: |
          FORCE_FLAG=""
          if [[ "${{ github.event.inputs.force_analyze }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          python3 scripts/zalo-upstream-diff.py \
            --download \
            --analyze \
            --update-protocol \
            --report-dir docs/upstream-reports \
            --json-out /tmp/upstream-diff.json \
            $FORCE_FLAG

      - name: Create or update upstream sync PR
        if: steps.probe.outputs.is_newer == 'true' || github.event.inputs.force_analyze == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_VER: ${{ steps.probe.outputs.upstream_ver }}
          CURRENT_VER: ${{ steps.probe.outputs.current_ver }}
          CLASSIFICATION: ${{ steps.probe.outputs.classification }}
          REPORT_PATH: ${{ steps.probe.outputs.report_path }}
        run: |
          set -euo pipefail
          BRANCH="chore/upstream-zalo-${UPSTREAM_VER}"
          git config user.name "zalo-rust-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add protocol.json "$REPORT_PATH"
          if git diff --cached --quiet; then
            echo "No changes to commit for ${UPSTREAM_VER}"
            exit 0
          fi

          git commit -m "chore(upstream): analyze Zalo Desktop ${UPSTREAM_VER} (from ${CURRENT_VER})"
          git push --force-with-lease origin "$BRANCH"

          # Ensure automation labels exist
          for spec in \
            "upstream-sync:0068ff:Automated upstream Zalo Desktop update analysis" \
            "agy-auto:7c3aed:Eligible for Antigravity CLI autonomous PR worker" \
            "release:patch:0e8a16:Auto-bump patch version and publish release on merge" \
            "release:minor:1d76db:Auto-bump minor version and publish release on merge" \
            "ready-to-merge:2ea043:CI green and AI review clean" \
            "needs-human:d93f0b:Requires manual developer intervention"; do
            IFS=':' read -r name color desc <<< "$spec"
            gh label create "$name" --color "$color" --description "$desc" --force || true
          done

          RELEASE_LABEL="release:patch"
          if [[ "$CLASSIFICATION" == "feature-update" ]]; then
            RELEASE_LABEL="release:minor"
          fi

          PR_TITLE="chore(upstream): sync Zalo Desktop ${UPSTREAM_VER}"
          EXISTING_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" --body-file "$REPORT_PATH"
            echo "Updated existing PR #${EXISTING_PR}"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$REPORT_PATH" \
              --label "upstream-sync" \
              --label "agy-auto" \
              --label "$RELEASE_LABEL"
          fi
