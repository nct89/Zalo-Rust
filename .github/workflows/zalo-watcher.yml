name: Zalo Upstream Watcher

on:
  schedule:
    # Run daily at 02:00 UTC (09:00 UTC+7).
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    name: Check for new Zalo Desktop releases
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query official Zalo Desktop update feed
        id: probe
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request

          pinned = json.load(open("protocol.json", encoding="utf-8"))
          current_ver = pinned.get("zalo_desktop_version", "0.0.0").strip()
          current_zpw = pinned.get("client_version", "").strip()

          feeds = [
              "https://res-download-pc.zadn.vn/hybrid/latest.yml",
              "https://res-download-pc.zadn.vn/hybrid/latest-mac.yml",
          ]

          upstream_ver = ""
          feed_used = ""
          raw_snippet = ""
          for url in feeds:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Zalo-Rust-Watcher/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                  m = re.search(r"^version:\s*([0-9]+\.[0-9]+\.[0-9]+)", body, re.MULTILINE)
                  if m:
                      upstream_ver = m.group(1)
                      feed_used = url
                      raw_snippet = "\n".join(body.splitlines()[:10])
                      break
              except Exception as exc:
                  print(f"Feed {url} unavailable: {exc}")

          def parse_tuple(v):
              return tuple(int(x) for x in re.findall(r"\d+", v))

          is_newer = bool(upstream_ver) and parse_tuple(upstream_ver) > parse_tuple(current_ver)
          print(f"Pinned: {current_ver} (zpw_ver={current_zpw}) | Upstream: {upstream_ver or 'unknown'} | Newer: {is_newer}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"current_ver={current_ver}\n")
              out.write(f"current_zpw={current_zpw}\n")
              out.write(f"upstream_ver={upstream_ver}\n")
              out.write(f"feed_used={feed_used}\n")
              out.write(f"is_newer={'true' if is_newer else 'false'}\n")
          EOF

      - name: Open tracking issue if upstream version is newer
        if: steps.probe.outputs.is_newer == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = '${{ steps.probe.outputs.upstream_ver }}';
            const current = '${{ steps.probe.outputs.current_ver }}';
            const zpw = '${{ steps.probe.outputs.current_zpw }}';
            const feed = '${{ steps.probe.outputs.feed_used }}';
            const title = `Upstream Zalo Desktop update detected: ${upstream}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 50,
            });
            if (existing.data.some((issue) => issue.title === title)) {
              core.info(`Issue already exists for ${upstream}`);
              return;
            }

            const body = [
              `A newer upstream Zalo Desktop release **${upstream}** was detected (currently pinned: **${current}**, \`zpw_ver=${zpw}\`).`,
              '',
              `- Feed: \`${feed}\``,
              '',
              '### Verification Checklist',
              '- [ ] Check if `client_version` (`zpw_ver`) or `User-Agent` changed -> update `protocol.json` and `core/zalo-protocol/src/param_cipher.rs`.',
              '- [ ] Check `ParamCipher` key & request signing in `core/zalo-protocol`.',
              '- [ ] Check REST endpoints / WebSocket `cmd` changes in `core/zalo-client`.',
              '- [ ] Check `libzproto_wasm_bg.*.wasm` hash & exports in `assets/wasm/` and `core/zalo-sync2`.',
              '- [ ] Check UI assets (`zalo-font`, emoji catalog, `core/zalo-design` tokens & i18n strings).',
              '- [ ] Run `cargo test --workspace -- --test-threads=1` and tag a new release.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
