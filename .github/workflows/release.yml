name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build & Package Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            dpkg-dev \
            nasm \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libpulse-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests before packaging
        run: cargo test --workspace -- --test-threads=1

      - name: Build .deb package & portable tarball
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          export VERSION
          export ZALO_BUILD_VERSION="$VERSION"
          bash zalo-linux/packaging/deb/build-deb.sh

          STAGE="dist/zalo-linux-${VERSION}-linux-x86_64"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin" "$STAGE/share/zalo-rust" "$STAGE/share/applications" "$STAGE/share/icons"
          install -Dm755 target/release/zalo-gpui "$STAGE/bin/zalo-gpui"
          strip --strip-all "$STAGE/bin/zalo-gpui" || true
          bash zalo-linux/packaging/linux/stage-runtime-assets.sh "$STAGE/share/zalo-rust"
          install -Dm644 zalo-linux/packaging/linux/zalo-gpui.desktop "$STAGE/share/applications/zalo-gpui.desktop"
          install -Dm644 zalo-linux/crates/zalo-shell/assets/zalo-256.png "$STAGE/share/icons/zalo-gpui.png"
          install -Dm644 protocol.json "$STAGE/share/zalo-rust/protocol.json"

          tar -C dist -czf "dist/zalo-linux-${VERSION}-linux-x86_64.tar.gz" "zalo-linux-${VERSION}-linux-x86_64"
          cp protocol.json dist/protocol.json
          (cd dist && sha256sum *.deb *.tar.gz protocol.json > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/protocol.json
            dist/SHA256SUMS.txt

  build-macos:
    name: Build macOS .app
    runs-on: macos-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake nasm pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Zalo.app
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          export VERSION
          export ZALO_BUILD_VERSION="$VERSION"
          bash zalo-macos/packaging/build-app.sh

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  build-windows:
    name: Build Windows (x86_64) Portable & Setup
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NASM (for OpenH264)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test Windows crates before packaging
        run: cargo test -p zalo-shell-win -p zcall-audio-win -p zcall-engine-win -p zcall-core -- --test-threads=1

      - name: Build Windows portable zip (and optional Inno Setup)
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          pwsh zalo-windows/packaging/build-windows.ps1

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zalo-windows-x86_64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS-windows.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS-windows.txt
